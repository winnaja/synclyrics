# SyncLyrics — ตั้งค่าโมเดล AI (ข้อ 5.3)
# ค่าเริ่มต้นตั้งให้ NVIDIA RTX 4060 (VRAM 8 GB) บนคอมตั้งโต๊ะ
# แก้ไฟล์นี้ใน %LOCALAPPDATA%\SyncLyrics\config\models.yaml (เขียนเฉพาะค่าที่ต่าง ที่เหลือใช้ค่านี้)
version: 1
site_dir: ""              # โฟลเดอร์ site-packages ของ AI (torch ฯลฯ) ถ้าติดตั้งไว้ไดรฟ์อื่น เช่น D:/SyncLyricsAI/site · ว่าง = ใช้ของ .venv หลัก
model_dir: ""             # ที่เก็บน้ำหนักโมเดล เช่น D:/SyncLyricsAI/hf · ว่าง = ตามค่าเริ่มต้นของแต่ละไลบรารี

preload: true             # โหลดโมเดลค้างใน VRAM ตอนเปิดโปรแกรม (เพลงแรกไม่ต้องรอโหลด) · false = โหลดตอนใช้ครั้งแรก
device: auto              # auto = ใช้ CUDA ถ้ามี ไม่มีใช้ CPU (ช้า และแจ้งผู้ใช้)
vram_budget_mb: 6500      # งบ VRAM รวมของ AI worker
vram_reserve_mb: 1200     # เหลือไว้ให้ UI / shader / วิดีโอ เสมอ
cudnn_benchmark: false     # ปิด: เสียงแต่ละบรรทัดยาวไม่เท่ากัน benchmark ซ้ำทุกความยาว (วัดจริงช้าลง ~10 เท่า)
empty_cache_after_track: true
worker_priority: below_normal   # ต่ำกว่า UI และเสียงเสมอ
watchdog_timeout_s: 20    # ไม่มี heartbeat นานเท่านี้ = worker ค้าง -> restart

demucs:
  enabled: true           # false = ข้ามการแยกเสียง (alignment ใช้เสียงรวม แม่นน้อยลง)
  model: htdemucs
  fp16: true
  segment_s: 7.0          # ขนาดช่วงที่ Demucs ประมวลผลต่อครั้ง (htdemucs สูงสุด ~7.8)
  shifts: 0               # >0 แม่นขึ้นเล็กน้อยแต่ช้าลงเป็นเท่าตัว
  overlap: 0.25

align:                    # torchaudio MMS_FA
  enabled: true
  fp16: true
  batch_lines: 16         # จำนวนบรรทัดที่ align พร้อมกัน
  min_confidence: 0.45    # ต่ำกว่านี้ใช้เวลาแบบประมาณแทน
  global_align: false          # จัดเวลาทั้งเพลงด้วย CTC เทียบกับผล Whisper (วัดแล้วยังไม่เพิ่มบรรทัดที่จับคู่ได้ + ช้าลง ~15 วิ ปิดไว้ก่อน)
  global_min_confidence: 0.5
  global_switch_gain: 0.15

whisper:                  # faster-whisper (ใช้เมื่อไม่มีเนื้อเพลง หรือไม่มีเวลาบรรทัด)
  enabled: true
  model: large-v3-turbo
  compute_type: float16
  fallback_compute_type: int8_float16   # ใช้เมื่อ VRAM ไม่พอ
  keep_loaded: true       # true = ค้างใน VRAM (เร็ว ใช้ ~1.7 GB) · false = โหลดเฉพาะตอนใช้แล้ว unload
  beam_size: 5

beats:
  prefer: beat_this       # allin1 ถ้าติดตั้งได้ (ได้ท่อนเพลงด้วย) / beat_this ติดตั้งง่ายกว่า
  beat_this_checkpoint: final0
  min_confidence_for_beatmatch: 0.6

progressive:              # ประมวลผลแบบทยอย (ข้อ 5.2)
  chunk_s: 20.0
  overlap_s: 2.5          # ซ้อนหัวท้ายแต่ละช่วง (ตัดที่ขอบบรรทัด)
  lead_s: 30.0            # ต้องนำหน้าตัวเล่นอย่างน้อยเท่านี้
  analysis_deadline_before_mix_s: 30.0

translate:                # คำแปล (เฟส 4) — โมเดลแปลในเครื่อง
  enabled: true
  model: JustFrederik/nllb-200-distilled-1.3B-ct2-int8
  target_lang: tha_Thai
  beam_size: 4
  keep_loaded: false

emphasis:                # คำเน้นของเพลง (AI ภาษาในเครื่อง ~4 GB โหลดครั้งแรก) — เลือกคำที่มีน้ำหนักทางอารมณ์ให้ขยาย/เรืองแสงตอนร้อง
  enabled: true
  model: jncraton/Qwen3-4B-Instruct-2507-ct2-int8
  local_name: qwen3-4b-instruct-2507-ct2-int8
  delay_s: 45              # รอหลังเปิดเพลงก่อนเริ่ม + รองานจัดเวลาที่ค้างให้เสร็จก่อน (ไม่ขวางเพลงถัดไปตอนข้ามรัว)

analysis:                 # การฟังเสียงเบื้องหลังเพื่อจัดเวลาเนื้อเพลง (แอปไม่เล่นเสียงเอง โหลดเสียงมาวิเคราะห์อย่างเดียว)
  enabled: true
  max_song_s: 900         # ยาวกว่านี้ไม่ใช่เพลง ข้าม
  sample_rate: 44100
  window_s: 30            # ประมวลผลทีละช่วงเท่านี้ แล้วทยอยส่งผลเข้าหน้าจอ
  context_s: 3
  min_coverage: 0.25      # จับคู่เนื้อเพลงกับเสียงได้น้อยกว่านี้ = เนื้อเพลงอาจเป็นคนละเวอร์ชัน
  heard_extras: true      # เก็บสิ่งที่ AI ได้ยินแต่ไม่มีในเนื้อเพลงเว็บ (คอรัส/ad-lib) เป็นแถวเสียงประสานตัวเล็ก
  detect_backing: true    # AI ตรวจบรรทัดเสียงประสาน/คอรัส แสดงเป็นแถวเล็ก
  prefer_heard: false     # ยึดเนื้อเพลงเว็บเป็นหลัก แล้วให้ AI จัดเวลา (ผู้ใช้สั่ง 2026-10-20) · true = แสดงตามเสียงที่ AI ได้ยินแทน
  reconstruct_below: 0.5  # จับคู่ตามลำดับได้น้อยกว่านี้ ลองสร้างบรรทัดตามลำดับที่ร้องจริง (รีมิกซ์/โครงสร้างต่าง)
  reconstruct_gain: 0.08  # ใช้ผลที่สร้างตามเสียงจริงเมื่อจับคู่ข้อความได้มากกว่าแบบเรียงลำดับอย่างน้อยเท่านี้
  transcript_version: 2   # เปลี่ยนเมื่อวิธีแยกเสียง/ถอดเสียงเปลี่ยน -> ต้องฟังเสียงใหม่ (ไม่เกี่ยวกับ algo_version)
  algo_version: 4         # เปลี่ยนเมื่อวิธีจัดเวลาเปลี่ยน -> ผลที่เก็บไว้เก่าหมดอายุ
